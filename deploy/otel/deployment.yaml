# =============================================================================
# OpenTelemetry Collector — workload
# -----------------------------------------------------------------------------
# Applications point their OTLP exporter at this Deployment (module 08):
#   kubectl -n demo set env deploy/demo-api OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector.observability.svc:4317
#
#   kubectl apply -k deploy/otel
#   kubectl -n observability logs deploy/otel-collector -f   # watch telemetry flow
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.162.0
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            # Prometheus-style self/metric exposition (scraped when you add
            # this service to the observability job in prometheus.yml)
            - name: metrics
              containerPort: 8889
          # The contrib image ships no health-check extension by default,
          # so probe the OTLP port directly.
          readinessProbe:
            tcpSocket: {port: otlp-grpc}
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: {port: otlp-grpc}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-config   # generated by kustomization.yaml
