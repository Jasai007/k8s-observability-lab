# =============================================================================
# Kibana — the log search UI (talks to Elasticsearch)
# -----------------------------------------------------------------------------
#   scripts/port-forward.sh kibana   -> http://localhost:5601
#   First run: create a data view/index pattern "observability-*"
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: observability
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.5.5   # MUST match the ES version
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: xpack.security.enabled
              value: "false"
          ports:
            - name: http
              containerPort: 5601
          readinessProbe:
            httpGet: {path: /api/status, port: 5601}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: 5601}
            initialDelaySeconds: 60
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: observability
  labels:
    app: kibana
spec:
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
