# =============================================================================
# Fluent Bit configuration — the LOG COLLECTION agent (part of the EFK stack)
# -----------------------------------------------------------------------------
# Mounted at /fluent-bit/etc/fluent-bit.yaml by the ConfigMap generated in
# deploy/logging/kustomization.yaml. Started with:
#   fluent-bit -c /fluent-bit/etc/fluent-bit.yaml   (see fluent-bit.yaml args)
#
# FORMAT NOTE: this is the modern YAML config format, NOT the old "classic"
# [SERVICE]/[INPUT] format. Fluent Bit v4/v5 parses classic files strictly:
# inline [PARSER] sections are rejected, CRLF line endings are fatal. The
# YAML format sidesteps both traps, and parsers live in the same file under
# the top-level `parsers:` key — one file, one ConfigMap, nothing to split.
#
# Pipeline (one DaemonSet pod per node):
#
#   /var/log/containers/*.log     Kubernetes metadata       Elasticsearch
#   inputs(tail) -> filters(k8s) -> outputs(es): observability-YYYY.MM.DD
#
# Works with containerd (kind/minikube) via the `cri` parser defined below:
#   2026-10-08T10:00:00.123456789Z stdout F {"level":"INFO","msg":"http request",...}
# The `log` capture name matters: the kubernetes filter with merge_log: true
# looks for `log` and parses its JSON into ES fields (level, msg, trace_id).
# =============================================================================

service:
  flush: 5             # flush to ES every 5 seconds
  daemon: false        # foreground — Kubernetes manages the process
  log_level: info
  http_server: true    # health/metrics endpoint for the lab
  http_listen: 0.0.0.0
  http_port: 2020

parsers:
  - name: cri
    format: regex
    regex: ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
    time_key: time
    time_format: "%Y-%m-%dT%H:%M:%S.%L%z"
    time_keep: true

pipeline:
  inputs:
    - name: tail
      tag: kube.*
      path: /var/log/containers/*.log
      parser: cri
      mem_buf_limit: 10MB
      skip_long_lines: true
      db: /var/db/fluent-bit/flb_kube.db   # persists read offsets across restarts

  filters:
    - name: kubernetes
      match: kube.*
      kube_url: https://kubernetes.default.svc:443
      kube_ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      kube_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kube_tag_prefix: kube.var.log.containers.
      # merge_log unpacks JSON log lines into ES fields (level, msg, trace_id).
      # keep_log MUST be false: after merging, the raw `log` string is dropped.
      # Otherwise the first plain-text line (e.g. Go logfmt from Prometheus:
      # "level=INFO msg=...") maps `log` as text/object in ES, and every later
      # line with a DIFFERENT shape is rejected with document_parsing_exception
      # (bulk 400s, endless retry loop). merge_log_trim keeps only valid JSON.
      merge_log: true
      merge_log_trim: true
      keep_log: false
      k8s-logging.parser: true

  outputs:
    - name: es
      match: kube.*
      host: elasticsearch
      port: 9200
      logstash_format: true      # index per day: observability-YYYY.MM.DD
      logstash_prefix: observability
      retry_limit: false         # keep retrying while ES starts up
      suppress_type_name: true   # ES 8+ removed mapping types
      generate_id: true          # idempotent retries (no duplicates)

