# =============================================================================
# Fluent Bit — log collection DaemonSet (the "F" agent of EFK)
# -----------------------------------------------------------------------------
# One pod per node tails /var/log/containers/*.log, enriches every line with
# Kubernetes metadata (pod, namespace, container, labels), parses the JSON the
# app emits, and ships it to Elasticsearch.
#
# RBAC: the [FILTER kubernetes] section must LIST/WATCH pods and namespaces
# to resolve metadata — granted below with read-only verbs.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: observability
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.3
          ports:
            # health/metrics endpoint (not scraped by Prometheus in this lab,
            # but handy: kubectl -n observability port-forward ds/fluent-bit 2020:2020)
            - name: http
              containerPort: 2020
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 2020}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 2020}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            # The generated ConfigMap contains exactly one key (fluent-bit.conf);
            # mount it as a FILE so the image's own parsers.conf stays intact.
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            # Container log files written by containerd (read-only by design)
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # Position DB: remembers how far it has read, so a restart
            # does not re-ship the whole log history.
            - name: posdb
              mountPath: /var/db/fluent-bit
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config     # generated by kustomization.yaml
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: posdb
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
