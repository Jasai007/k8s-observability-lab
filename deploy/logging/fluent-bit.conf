# =============================================================================
# Fluent Bit configuration — the LOG COLLECTION agent (part of the EFK stack)
# -----------------------------------------------------------------------------
# Mounted at /fluent-bit/etc/fluent-bit.conf by the ConfigMap generated in
# deploy/logging/kustomization.yaml.
#
# Pipeline (one DaemonSet pod per node):
#
#   /var/log/containers/*.log          Kubernetes metadata         Elasticsearch
#   [INPUT tail]  --[FILTER kubernetes]-- --[OUTPUT es]--> index observability-*
#
# Works with containerd (kind/minikube) via the built-in "cri" parser:
#   2026-10-08T10:00:00Z stdout F {"level":"INFO","msg":"http request",...}
# =============================================================================

[SERVICE]
    Flush         5               # flush to ES every 5 seconds
    Daemon        Off             # runs in the foreground (Kubernetes manages it)
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf   # ships with the image (includes "cri")
    HTTP_Server   On              # health/metrics endpoint for the lab
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# --- INPUT: read every container log file on this node -----------------------
[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    Parser            cri                 # containerd/CRI log format
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    DB                /var/db/fluent-bit/flb_kube.db   # persists read offsets

# --- FILTER: attach Kubernetes metadata (pod, namespace, container, ...) ------
[FILTER]
    Name              kubernetes
    Match             kube.*
    Kube_URL          https://kubernetes.default.svc:443
    Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix   kube.var.log.containers.
    # Merge_Log parses the JSON log line into separate ES fields
    # (level, msg, trace_id, ...) — this is what makes Kibana filtering work.
    Merge_Log         On
    K8S_Logging_Parser On

# --- OUTPUT: ship to Elasticsearch in the same namespace ---------------------
[OUTPUT]
    Name              es
    Match             kube.*
    Host              elasticsearch
    Port              9200
    Logstash_Format   On                  # index per day: observability-YYYY.MM.DD
    Logstash_Prefix   observability
    Retry_Limit       False               # keep retrying while ES starts up
    Suppress_Type_Name On                 # ES 8+ removed mapping types
    Generate_ID       On                   # idempotent retries (no duplicates)
