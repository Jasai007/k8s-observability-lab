# =============================================================================
# Grafana dashboard provisioning
# -----------------------------------------------------------------------------
# Mounted at /etc/grafana/provisioning/dashboards/dashboards.yml.
# Any *.json file placed in the folder below appears as a dashboard —
# dashboards are versioned in git with the rest of the project.
# =============================================================================

apiVersion: 1

providers:
  - name: labs
    orgId: 1
    folder: Observability      # grouping inside the Grafana sidebar
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30  # rescan the folder every 30s
    options:
      path: /var/lib/grafana/dashboards
