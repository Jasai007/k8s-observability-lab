# =============================================================================
# Kustomization — "kubectl apply -k deploy/app"
# -----------------------------------------------------------------------------
# The observed application: demo-api (order service) + demo-payment
# (downstream dependency). Both run the SAME image from apps/demo-api —
# only the --service flag and environment differ.
#
# Deployed in module 05. Build & load the image first:
#   scripts/deploy.sh          (builds demo-api:0.1.0 and runs kind load)
#
# namespace pins every resource here into `demo`, so the app never depends on
# the user's kubectl current-context namespace.
# =============================================================================
namespace: demo

resources:
  - deployment.yaml
  - service.yaml
