# =============================================================================
# The demo application — Services
# -----------------------------------------------------------------------------
# Port is named "http" (the demo-apps scrape job in prometheus.yml keeps
# exactly this port name).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
spec:
  selector:
    app: demo-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-payment
  namespace: demo
  labels:
    app: demo-payment
spec:
  selector:
    app: demo-payment
  ports:
    - name: http
      port: 8080
      targetPort: http
