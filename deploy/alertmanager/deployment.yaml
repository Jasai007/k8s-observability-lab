# =============================================================================
# Alertmanager — workload
# -----------------------------------------------------------------------------
# Receives firing alerts from Prometheus, groups/deduplicates them, then hands
# them to a receiver (no integration configured in this lab — watch the UI).
#
#   kubectl apply -k deploy/alertmanager
#   kubectl -n observability rollout status deploy/alertmanager
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.32.2
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: metrics
              containerPort: 9093
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9093}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /-/ready, port: 9093}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config   # generated by kustomization.yaml
        - name: data
          emptyDir: {}
