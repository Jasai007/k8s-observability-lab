# =============================================================================
# Prometheus — workload
# -----------------------------------------------------------------------------
# Config files sit next to this manifest and are embedded into a ConfigMap at
# apply time by kustomization.yaml (configMapGenerator) — one source of truth,
# no copy-paste drift.
#
#   kubectl apply -k deploy/prometheus
#   kubectl -n observability rollout status deploy/prometheus
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  replicas: 1                      # single Prometheus = its own TSDB; HA is module 11
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus   # identity used for Kubernetes API discovery
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d   # small TSDB for a lab (module 11 covers sizing)
            - --web.enable-lifecycle             # allows POST /-/reload to apply config edits
          ports:
            - name: metrics
              containerPort: 9090
          # Probes: liveness restarts a wedged container, readiness removes an
          # unready pod from the Service. Prometheus ships these endpoints built-in.
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            initialDelaySeconds: 5
          resources:                 # always set these — see module 11
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml   # mount just the file, keep the rest of the dir
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config      # generated by kustomization.yaml
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}                   # ephemeral storage — fine for a lab
